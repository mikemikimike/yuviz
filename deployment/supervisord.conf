; Run in a foreground terminal: mkdir -p ~/.yuviz/logs && supervisord -c deployment/supervisord.conf
; MySQL, PostgreSQL and Redis stay under `brew services` (start_data in scripts/start_local.sh).

[supervisord]
nodaemon=true
logfile=%(ENV_HOME)s/.yuviz/logs/supervisord.log
pidfile=%(ENV_HOME)s/.yuviz/supervisord.pid
childlogdir=%(ENV_HOME)s/.yuviz/logs

[unix_http_server]
file=%(ENV_HOME)s/.yuviz/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/.yuviz/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Every program: services write their own log file, so supervisord's pipe only sees launcher errors.
; stopasgroup/killasgroup reach the real process under the bash wrapper.

[program:kamailio]
command=/bin/bash -c '. scripts/start_local.sh >/dev/null && start_kamailio >> "$YUVIZ_LOGS/kamailio.log" 2>&1'
directory=%(here)s/..
priority=10
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
autorestart=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.yuviz/logs/%(program_name)s.supervisor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1

